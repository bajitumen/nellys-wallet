<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}Nelly's Wallet{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://cdn.plaid.com">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f0f0f0;
    --line: #eeeeee;
    --line-soft: #f0f0f0;
    --line-dashed: #dddddd;
    --text: #1a1a1a;
    --text-mid: #666666;
    --text-muted: #888888;
    --text-faint: #999999;
    --positive: #1a7f3e;
    --negative: #b0001f;
  }
  :root[data-theme="dark"] {
    --bg: #0f1011;
    --surface: #1a1b1c;
    --surface-alt: #2a2b2d;
    --line: #2a2b2d;
    --line-soft: #232425;
    --line-dashed: #3a3b3d;
    --text: #e8e8e8;
    --text-mid: #c8c8c8;
    --text-muted: #b4b4b4;
    --text-faint: #9a9a9a;
    --positive: #4ade80;
    --negative: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 2rem 0 0;
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: flex-start;
    display: flex;
    flex-direction: column;
  }
  .logo {
    display: block;
    padding: 0 1.5rem 1.75rem;
    color: var(--text);
    font-size: 2.25rem;
    line-height: 1;
    text-decoration: none;
  }
  .logo:hover { color: var(--text); }
  .sidebar nav a {
    display: block;
    padding: 0.55rem 1.5rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
    border-left: 2px solid transparent;
  }
  .sidebar nav a:hover { background: var(--bg); }
  .sidebar nav a.active {
    border-left-color: var(--text);
    background: var(--bg);
    font-weight: 500;
  }
  .header-user-button {
    display: inline-flex;
    align-items: center;
    height: 34px;
    margin-left: 0.25rem;
  }
  .auth-mount-wrap {
    display: flex;
    justify-content: center;
    padding: 2rem 0;
  }
  .plaid-setup-card {
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.5rem;
  }
  .plaid-setup-form { display: flex; flex-direction: column; gap: 1rem; }
  .plaid-setup-label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .plaid-setup-label input {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  .plaid-setup-label input:focus { outline: none; border-color: var(--text-mid); }
  .plaid-setup-actions { display: flex; justify-content: flex-end; }
  .plaid-setup-actions button.primary {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 0.55rem 1.2rem;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .plaid-setup-help {
    margin-top: 1.25rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .plaid-setup-help a { color: var(--text); }
  .theme-toggle {
    margin-top: auto;
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--line);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.85rem 1.5rem;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  .theme-toggle:hover { background: var(--bg); color: var(--text); }
  .theme-toggle .icon { width: 14px; height: 14px; flex-shrink: 0; }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .label-light { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
  :root[data-theme="dark"] .theme-toggle .label-dark { display: none; }
  :root[data-theme="dark"] .theme-toggle .label-light { display: inline; }
  main {
    flex: 1;
    padding: 2rem 2.5rem;
    max-width: 1100px;
  }
  h1 { font-weight: 500; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .page-actions { display: flex; gap: 0.5rem; }
  .action-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    cursor: pointer;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    font-size: 1.05rem;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    flex-shrink: 0;
    transition: background 0.1s;
  }
  .action-btn:hover { background: var(--bg); }
  .action-btn:disabled { opacity: 0.5; cursor: wait; }
  .action-btn.busy i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .source-filter {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.75rem;
    font-size: 0.92rem;
    border-bottom: 1px solid var(--line);
  }
  .source-filter a {
    color: var(--text-muted);
    text-decoration: none;
    padding: 0.35rem 0 0.55rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .source-filter a:hover { color: var(--text); }
  .source-filter a.active {
    color: var(--text);
    border-bottom-color: var(--text);
    font-weight: 500;
  }
  .totals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.1rem 1.3rem;
  }
  .card .label { color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value {
    font-size: 1.4rem;
    font-weight: 500;
    margin-top: 0.3rem;
    display: flex;
    align-items: center;
  }
  .card.net .value { color: var(--positive); }
  .card.credit .value { color: var(--negative); }
  .card .value .delta {
    color: var(--text-muted);
    font-size: 0.4em;
    font-weight: 400;
    margin-left: 0.3rem;
    letter-spacing: 0.01em;
    vertical-align: middle;
  }
  .card .value .delta.delta-up { color: var(--negative); }
  .card .value .delta.delta-down { color: var(--positive); }
  /* Income inverts the polarity: more money is good (green), less is bad (red). */
  .card .value .delta.delta-good { color: var(--positive); }
  .card .value .delta.delta-bad { color: var(--negative); }
  h2 {
    font-weight: 500;
    font-size: 1.1rem;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--line);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td {
    text-align: left;
    padding: 0.55rem 0.5rem;
    border-bottom: 1px solid var(--line-soft);
  }
  th { font-weight: 500; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sortable::after {
    content: "\2195"; /* ↕ */
    display: inline-block;
    margin-left: 0.3rem;
    opacity: 0.35;
    font-size: 0.85em;
  }
  th.sortable.sort-asc::after { content: "\2191"; opacity: 1; } /* ↑ */
  th.sortable.sort-desc::after { content: "\2193"; opacity: 1; } /* ↓ */
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .muted { color: var(--text-faint); }
  .diff { font-variant-numeric: tabular-nums; }
  .diff-good { color: var(--positive); }
  .diff-bad { color: var(--negative); }
  /* Avatars (PNG logos + letter-tile fallbacks) share these box rules so a
     row's vertical rhythm stays consistent regardless of which form renders.
     vertical-align: middle pins both to the text x-height — simpler and
     more reliable across cells than a hardcoded pixel offset. */
  .inst-logo,
  .inst-letter {
    display: inline-block;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 0.45rem;
    margin-top: -2px;  /* nudge to optically center with text */
    flex-shrink: 0;
  }
  .inst-logo {
    object-fit: contain;
    background: var(--surface);
  }
  .inst-letter {
    text-align: center;
    line-height: 18px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
  }
  .error { color: var(--negative); font-size: 0.85rem; margin-top: 0.5rem; }
  .empty {
    background: var(--surface);
    border: 1px dashed var(--line-dashed);
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    color: var(--text-mid);
  }
  code {
    background: var(--surface-alt);
    padding: 0.15rem 0.35rem;
    border-radius: 4px;
    font-size: 0.85em;
  }
  .tx-actions { position: relative; width: 28px; text-align: right; padding-right: 0; }
  .kebab {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0.25rem 0.35rem;
    border-radius: 4px;
    font-size: 1rem;
    line-height: 1;
    display: inline-flex;
    align-items: center;
  }
  .kebab:hover { background: var(--bg); color: var(--text); }
  .tx-menu {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-width: 200px;
    z-index: 10;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    padding: 0.35rem 0;
    font-size: 0.9rem;
    text-align: left;
  }
  .tx-menu.tx-menu-up {
    top: auto;
    bottom: 100%;
    margin-top: 0;
    margin-bottom: 4px;
  }
  .tx-menu-item {
    display: block;
    width: 100%;
    padding: 0.5rem 0.9rem;
    background: transparent;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .tx-menu-item:hover { background: var(--bg); }
  .tx-form { padding: 0.7rem 0.9rem; display: flex; flex-direction: column; gap: 0.45rem; }
  .tx-form label { font-size: 0.78rem; color: var(--text-muted); }
  .tx-form select, .tx-form input {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  .tx-form-row { display: flex; gap: 0.4rem; align-items: center; }
  .tx-form-row label { flex-shrink: 0; }
  .tx-form-divider { text-align: center; color: var(--text-faint); font-size: 0.75rem; margin: 0.1rem 0; }
  .tx-form-actions { display: flex; gap: 0.4rem; justify-content: flex-end; margin-top: 0.3rem; }
  .tx-form button {
    padding: 0.35rem 0.75rem;
    font-family: inherit;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }
  .tx-form button.primary {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }
  .split-tag { color: var(--text-faint); font-size: 0.85em; margin-left: 0.4rem; }
  .inline-dropdown { position: relative; display: inline-block; }
  .inline-dropdown-trigger {
    background: transparent;
    border: 1px solid transparent;
    color: inherit;
    font: inherit;
    font-size: 0.92rem;
    padding: 0.2rem 0.45rem;
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    line-height: 1.2;
    max-width: 100%;
  }
  .inline-dropdown-trigger:hover,
  .inline-dropdown-trigger[aria-expanded="true"] {
    background: var(--surface);
    border-color: var(--line);
  }
  .inline-dropdown-trigger:focus { outline: none; }
  .inline-dropdown-trigger i {
    font-size: 0.7rem;
    color: var(--text-faint);
    transition: color 0.1s;
  }
  .inline-dropdown-trigger:hover i,
  .inline-dropdown-trigger[aria-expanded="true"] i {
    color: var(--text-muted);
  }
  .inline-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    z-index: 20;
    min-width: 200px;
    max-height: 320px;
    overflow-y: auto;
    padding: 0.35rem 0;
  }
  .inline-dropdown-menu.inline-dropdown-menu-up {
    top: auto;
    bottom: calc(100% + 4px);
  }
  .inline-dropdown-option {
    display: block;
    width: 100%;
    padding: 0.5rem 0.9rem;
    background: transparent;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .inline-dropdown-option:hover { background: var(--bg); }
  .inline-dropdown-option.active { background: var(--bg); font-weight: 500; }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1rem 1.3rem;
    margin-bottom: 2rem;
  }
  .chart-card .label {
    color: var(--text-muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.6rem;
  }
  .networth-chart svg { display: block; width: 100%; height: 150px; margin-top: 0.4rem; }
  .networth-guide { stroke: var(--text-faint); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
  /* The dot is an HTML element on body so preserveAspectRatio="none" on the
     SVG doesn't squash it into an ellipse. */
  .networth-dot {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--positive);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
  }
  .networth-waiting { color: var(--text-muted); font-size: 0.92rem; margin-top: 0.4rem; }
  /* Two charts side-by-side, each spanning 2 of the totals row's 4 columns.
     Math: 2*card + gap = total/2 - gap/2, which equals (total - gap)/2,
     which is what 1fr 1fr with the same gap produces. So columns align. */
  .overview-charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .monthly-spend-chart svg { display: block; width: 100%; height: 180px; margin-top: 0.4rem; }
  .chart-range-filter {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.7rem;
    justify-content: center;
  }
  .chart-range-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: background 0.1s, color 0.1s;
  }
  .chart-range-btn:hover { color: var(--text); background: var(--bg); }
  .chart-range-btn.active {
    color: var(--text);
    background: var(--bg);
    border-color: var(--line);
  }
  .monthly-spend-chart .bar { fill-opacity: 0.75; transition: fill-opacity 0.1s; }
  .monthly-spend-chart .bar:hover { fill-opacity: 1; }
  .monthly-spend-chart .bar-spend { fill: var(--negative); }
  .monthly-spend-chart .bar-income { fill: var(--positive); }
  .monthly-spend-chart .zero-line {
    stroke: var(--line);
    stroke-width: 1;
  }
  /* Synthetic zero baseline + spike up = always green ("rising from nothing"). */
  .networth-chart .networth-line-synth { stroke: var(--positive); }
  /* Real data line follows the chart's overall trend. */
  .networth-chart.trend-up .networth-line-real { stroke: var(--positive); }
  .networth-chart.trend-down .networth-line-real { stroke: var(--negative); }
  .networth-chart.trend-up .networth-area { fill: var(--positive); fill-opacity: 0.12; }
  .networth-chart.trend-down .networth-area { fill: var(--negative); fill-opacity: 0.12; }
  .stacked-bar {
    display: flex;
    width: 100%;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-alt);
  }
  .stacked-bar-segment { height: 100%; min-width: 1px; }
  .stacked-bar-segment:hover { filter: brightness(1.08); }
  .bar-tooltip {
    position: fixed;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.4rem 0.65rem;
    font-size: 0.82rem;
    font-weight: 500;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    margin-top: -8px;
    opacity: 0;
    transition: opacity 0.08s ease-out;
  }
  .bar-tooltip.visible { opacity: 1; }
  .cat-dot-col { width: 18px; padding-right: 0; }
  .cat-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    vertical-align: middle;
  }
  .month-card { position: relative; overflow: visible; }
  .month-trigger {
    background: transparent;
    border: none;
    font: inherit;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    line-height: 1;
  }
  .month-trigger i { font-size: 0.75rem; color: var(--text-faint); transition: color 0.1s; }
  .month-trigger:hover i { color: var(--text); }
  .month-menu {
    position: absolute;
    top: calc(100% - 0.5rem);
    left: 1.3rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    z-index: 10;
    min-width: 180px;
    max-height: 320px;
    overflow-y: auto;
    padding: 0.35rem 0;
  }
  .month-menu a {
    display: block;
    padding: 0.5rem 0.9rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .month-menu a:hover { background: var(--bg); }
  .month-menu a.active { background: var(--bg); font-weight: 500; }
  .budget-columns {
    column-count: 2;
    column-gap: 2.5rem;
  }
  .budget-group {
    margin-bottom: 2.25rem;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
  }
  .budget-group-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 0.45rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 0.4rem;
  }
  .budget-group-name { font-size: 1.05rem; font-weight: 500; }
  .budget-group-name .cat-dot { margin-right: 0.4rem; }
  .budget-group-total {
    font-size: 1rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .budget-table { width: 100%; }
  .budget-table td { border-bottom: 1px solid var(--line-soft); }
  .budget-sub-label { padding: 0.55rem 0.5rem; color: var(--text-mid); }
  .budget-sub-amount {
    width: 180px;
    padding: 0.35rem 0.5rem;
    text-align: right;
  }
  .budget-input-wrap {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.05rem 0.5rem;
    transition: border-color 0.1s;
  }
  .budget-input-wrap:focus-within { border-color: var(--text-mid); }
  .budget-input-wrap .prefix { color: var(--text-faint); font-size: 0.92rem; }
  .budget-input {
    width: 90px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    text-align: right;
    padding: 0.3rem 0;
  }
  .budget-input:focus { outline: none; }
  .budget-input::-webkit-outer-spin-button,
  .budget-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
  }
  .budget-input[type=number] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  /* Planning page */
  .planning-chart-card { padding: 1rem 1.3rem; }
  .planning-chart-card svg {
    display: block;
    width: 100%;
    height: 220px;
    margin-top: 0.6rem;
  }
  .planning-chart-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .planning-target {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .planning-target-label {
    color: var(--text-muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .planning-target select {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.3rem 0.55rem;
    font: inherit;
    font-size: 0.92rem;
    color: var(--text);
  }
  .planning-target select:focus { outline: none; border-color: var(--text-mid); }
  .planning-horizon-filter {
    display: flex;
    gap: 0.25rem;
  }
  .planning-line { stroke: var(--text); }
  .planning-area { fill: var(--text); fill-opacity: 0.06; }
  .planning-trend-up.planning-line { stroke: var(--positive); }
  .planning-trend-up.planning-area { fill: var(--positive); fill-opacity: 0.12; }
  .planning-trend-down.planning-line { stroke: var(--negative); }
  .planning-trend-down.planning-area { fill: var(--negative); fill-opacity: 0.12; }
  .planning-summary {
    margin-top: 0.7rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .planning-rates-table { width: 100%; margin-top: 0.5rem; }
  .planning-acct-name { font-weight: 500; }
  .planning-acct-type { margin-left: 0.4rem; font-size: 0.82rem; }
  .planning-rate-input-wrap {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.05rem 0.5rem;
    transition: border-color 0.1s;
    min-width: 100px;
  }
  .planning-rate-input-wrap:focus-within { border-color: var(--text-mid); }
  .planning-rate-input-wrap .prefix {
    color: var(--text-faint);
    font-size: 0.92rem;
  }
  .planning-rate-input {
    width: 75px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    text-align: right;
    padding: 0.3rem 0;
  }
  .planning-rate-input:focus { outline: none; }
  .planning-rate-input::-webkit-outer-spin-button,
  .planning-rate-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
  }
  .planning-rate-input[type=number] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <a class="logo" href="/" aria-label="Nelly's Wallet home">
    <i class="ph ph-paw-print"></i>
  </a>
  <nav>
    <a href="/" class="{% if active_page == 'overview' %}active{% endif %}">Overview</a>
    <a href="/spending" class="{% if active_page == 'spending' %}active{% endif %}">Spending</a>
    <a href="/income" class="{% if active_page == 'income' %}active{% endif %}">Income</a>
    <a href="/budget" class="{% if active_page == 'budget' %}active{% endif %}">Budget</a>
    <a href="/planning" class="{% if active_page == 'planning' %}active{% endif %}">Planning</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
    <span class="label-dark">Dark mode</span>
    <span class="label-light">Light mode</span>
  </button>
</aside>
<main>
<div class="page-header">
  <h1>{% block heading %}{% endblock %}</h1>
  {% if g.user %}
  <div class="page-actions">
    <button class="action-btn" id="refresh-btn" type="button"
            aria-label="Refresh data"
            title="Last synced {{ last_sync_label }}">
      <i class="ph ph-arrows-clockwise"></i>
    </button>
    <button class="action-btn" id="add-account-btn" type="button"
            aria-label="Add account"
            title="Add account">
      <i class="ph ph-plus"></i>
    </button>
    {% if clerk_enabled %}
    <div class="header-user-button" id="clerk-user-button"></div>
    {% endif %}
  </div>
  {% endif %}
</div>
{% block content %}{% endblock %}
</main>
</div>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
{% if clerk_enabled %}
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="{{ clerk_publishable_key }}"
  src="https://{{ clerk_frontend_api }}/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"
  onload="window.dispatchEvent(new Event('clerk:loaded'))"
></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endif %}
<script src="{{ url_for('static', filename='layout.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
