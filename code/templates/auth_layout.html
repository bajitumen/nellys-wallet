<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}Nelly's Wallet{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<script>
  // Mirror the dark/light bootstrap in _layout.html so the auth page picks
  // up the user's saved preference (or OS default) without a flash.
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #111213;
    --text-muted: #5a5d62;
    --text-faint: #8a8d92;
    --line: #e3e4e6;
    --negative: #c63a3a;
  }
  :root[data-theme="dark"] {
    --bg: #0f1011;
    --surface: #17181a;
    --text: #f1f1f1;
    --text-muted: #a0a3a8;
    --text-faint: #6e7176;
    --line: #2a2c2f;
    --negative: #e26060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  /* Plaid-setup card: same minimal-page treatment as the Clerk sign-in
     widget — narrow column floating on a blank background. */
  .plaid-setup-card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 2.25rem 1.75rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
  }
  .plaid-setup-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .plaid-setup-subtitle {
    color: var(--text-muted);
    font-size: 0.88rem;
    line-height: 1.4;
    margin-bottom: 1.5rem;
  }
  .plaid-setup-form {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  .plaid-setup-label {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .plaid-setup-label input {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.1s;
  }
  .plaid-setup-label input:focus { outline: none; border-color: var(--text-faint); }
  .plaid-setup-error {
    color: var(--negative);
    font-size: 0.85rem;
  }
  .plaid-setup-submit {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    margin-top: 0.3rem;
  }
  .plaid-setup-submit:hover { opacity: 0.9; }
  .plaid-setup-help {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    color: var(--text-muted);
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .plaid-setup-help a { color: var(--text); }
</style>
</head>
<body>
{% block content %}{% endblock %}
{% if clerk_enabled %}
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="{{ clerk_publishable_key }}"
  src="https://{{ clerk_frontend_api }}/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"
  onload="window.dispatchEvent(new Event('clerk:loaded'))"
></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endif %}
</body>
</html>
