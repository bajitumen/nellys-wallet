[project]
name = "nellys-wallet"
version = "0.1.0"
description = "Personal finance dashboard backed by Plaid."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "flask-wtf>=1.2",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "plaid-python>=38",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    # Kept available for ad-hoc schema diffs but not used at runtime; init_db()
    # in code/db.py runs in-place migrations directly.
    "alembic>=1.13",
]
prod = [
    "gunicorn>=23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
