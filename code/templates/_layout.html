<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Nelly's Wallet{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://cdn.plaid.com">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f0f0f0;
    --line: #eeeeee;
    --line-soft: #f0f0f0;
    --line-dashed: #dddddd;
    --text: #1a1a1a;
    --text-mid: #666666;
    --text-muted: #888888;
    --text-faint: #999999;
    --positive: #1a7f3e;
    --negative: #b0001f;
  }
  :root[data-theme="dark"] {
    --bg: #0f1011;
    --surface: #1a1b1c;
    --surface-alt: #2a2b2d;
    --line: #2a2b2d;
    --line-soft: #232425;
    --line-dashed: #3a3b3d;
    --text: #e8e8e8;
    --text-mid: #c8c8c8;
    --text-muted: #b4b4b4;
    --text-faint: #9a9a9a;
    --positive: #4ade80;
    --negative: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 2rem 0 0;
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: flex-start;
    display: flex;
    flex-direction: column;
  }
  .logo {
    display: block;
    padding: 0 1.5rem 1.75rem;
    color: var(--text);
    font-size: 2.25rem;
    line-height: 1;
    text-decoration: none;
  }
  .logo:hover { color: var(--text); }
  .sidebar nav a {
    display: block;
    padding: 0.55rem 1.5rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
    border-left: 2px solid transparent;
  }
  .sidebar nav a:hover { background: var(--bg); }
  .sidebar nav a.active {
    border-left-color: var(--text);
    background: var(--bg);
    font-weight: 500;
  }
  .theme-toggle {
    margin-top: auto;
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--line);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.85rem 1.5rem;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  .theme-toggle:hover { background: var(--bg); color: var(--text); }
  .theme-toggle .icon { width: 14px; height: 14px; flex-shrink: 0; }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .label-light { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
  :root[data-theme="dark"] .theme-toggle .label-dark { display: none; }
  :root[data-theme="dark"] .theme-toggle .label-light { display: inline; }
  main {
    flex: 1;
    padding: 2rem 2.5rem;
    max-width: 1100px;
  }
  h1 { font-weight: 500; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .page-actions { display: flex; gap: 0.5rem; }
  .action-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    cursor: pointer;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    font-size: 1.05rem;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    flex-shrink: 0;
    transition: background 0.1s;
  }
  .action-btn:hover { background: var(--bg); }
  .action-btn:disabled { opacity: 0.5; cursor: wait; }
  .action-btn.busy i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .source-filter {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.75rem;
    font-size: 0.92rem;
    border-bottom: 1px solid var(--line);
  }
  .source-filter a {
    color: var(--text-muted);
    text-decoration: none;
    padding: 0.35rem 0 0.55rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .source-filter a:hover { color: var(--text); }
  .source-filter a.active {
    color: var(--text);
    border-bottom-color: var(--text);
    font-weight: 500;
  }
  .totals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.1rem 1.3rem;
  }
  .card .label { color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.4rem; font-weight: 500; margin-top: 0.3rem; }
  .card.net .value { color: var(--positive); }
  .card.credit .value { color: var(--negative); }
  h2 {
    font-weight: 500;
    font-size: 1.1rem;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--line);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td {
    text-align: left;
    padding: 0.55rem 0.5rem;
    border-bottom: 1px solid var(--line-soft);
  }
  th { font-weight: 500; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .muted { color: var(--text-faint); }
  .error { color: var(--negative); font-size: 0.85rem; margin-top: 0.5rem; }
  .empty {
    background: var(--surface);
    border: 1px dashed var(--line-dashed);
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    color: var(--text-mid);
  }
  code {
    background: var(--surface-alt);
    padding: 0.15rem 0.35rem;
    border-radius: 4px;
    font-size: 0.85em;
  }
  .tx-actions { position: relative; width: 28px; text-align: right; padding-right: 0; }
  .kebab {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0.25rem 0.35rem;
    border-radius: 4px;
    font-size: 1rem;
    line-height: 1;
    display: inline-flex;
    align-items: center;
  }
  .kebab:hover { background: var(--bg); color: var(--text); }
  .tx-menu {
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-width: 200px;
    z-index: 10;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    padding: 0.35rem 0;
    font-size: 0.9rem;
    text-align: left;
  }
  .tx-menu.tx-menu-up {
    top: auto;
    bottom: 100%;
    margin-top: 0;
    margin-bottom: 4px;
  }
  .tx-menu-item {
    display: block;
    width: 100%;
    padding: 0.5rem 0.9rem;
    background: transparent;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .tx-menu-item:hover { background: var(--bg); }
  .tx-form { padding: 0.7rem 0.9rem; display: flex; flex-direction: column; gap: 0.45rem; }
  .tx-form label { font-size: 0.78rem; color: var(--text-muted); }
  .tx-form select, .tx-form input {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  .tx-form-row { display: flex; gap: 0.4rem; align-items: center; }
  .tx-form-row label { flex-shrink: 0; }
  .tx-form-divider { text-align: center; color: var(--text-faint); font-size: 0.75rem; margin: 0.1rem 0; }
  .tx-form-actions { display: flex; gap: 0.4rem; justify-content: flex-end; margin-top: 0.3rem; }
  .tx-form button {
    padding: 0.35rem 0.75rem;
    font-family: inherit;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }
  .tx-form button.primary {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }
  .split-tag { color: var(--text-faint); font-size: 0.85em; margin-left: 0.4rem; }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1rem 1.3rem;
    margin-bottom: 2rem;
  }
  .chart-card .label {
    color: var(--text-muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.6rem;
  }
  .chart-card svg { display: block; width: 100%; height: 120px; }
  .month-card { position: relative; overflow: visible; }
  .month-trigger {
    background: transparent;
    border: none;
    font: inherit;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    line-height: 1;
  }
  .month-trigger i { font-size: 0.75rem; color: var(--text-faint); transition: color 0.1s; }
  .month-trigger:hover i { color: var(--text); }
  .month-menu {
    position: absolute;
    top: calc(100% - 0.5rem);
    left: 1.3rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    z-index: 10;
    min-width: 180px;
    max-height: 320px;
    overflow-y: auto;
    padding: 0.35rem 0;
  }
  .month-menu a {
    display: block;
    padding: 0.5rem 0.9rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .month-menu a:hover { background: var(--bg); }
  .month-menu a.active { background: var(--bg); font-weight: 500; }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <a class="logo" href="/" aria-label="Nelly's Wallet home">
    <i class="ph ph-paw-print"></i>
  </a>
  <nav>
    <a href="/" class="{% if active_page == 'overview' %}active{% endif %}">Overview</a>
    <a href="/spending" class="{% if active_page == 'spending' %}active{% endif %}">Spending</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
    <span class="label-dark">Dark mode</span>
    <span class="label-light">Light mode</span>
  </button>
</aside>
<main>
<div class="page-header">
  <h1>{% block heading %}{% endblock %}</h1>
  {% if g.user %}
  <div class="page-actions">
    <button class="action-btn" id="refresh-btn" type="button"
            aria-label="Refresh data"
            title="Last synced {{ last_sync_label }}">
      <i class="ph ph-arrows-clockwise"></i>
    </button>
    <button class="action-btn" id="add-account-btn" type="button"
            aria-label="Add account"
            title="Add account">
      <i class="ph ph-plus"></i>
    </button>
  </div>
  {% endif %}
</div>
{% block content %}{% endblock %}
</main>
</div>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
  // Theme toggle
  document.querySelector('.theme-toggle').addEventListener('click', function() {
    var html = document.documentElement;
    var isDark = html.getAttribute('data-theme') === 'dark';
    if (isDark) {
      html.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      html.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
  });

  // Refresh button → POST /sync, reload
  (function() {
    var btn = document.getElementById('refresh-btn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      if (btn.classList.contains('busy')) return;
      btn.classList.add('busy');
      fetch('/sync', { method: 'POST' })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (res.ok && res.data.ok) {
            window.location.reload();
          } else {
            alert('Sync failed: ' + (res.data.error || 'unknown error'));
            btn.classList.remove('busy');
          }
        })
        .catch(function(e) {
          alert('Sync error: ' + e.message);
          btn.classList.remove('busy');
        });
    });
  })();

  // Add-account button → fetch link token, open Plaid Link, exchange, reload
  (function() {
    var btn = document.getElementById('add-account-btn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      btn.disabled = true;
      fetch('/link/token', { method: 'POST' })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok || !res.data.link_token) {
            alert('Could not start Plaid Link: ' + (res.data.error || 'unknown error'));
            btn.disabled = false;
            return;
          }
          var handler = Plaid.create({
            token: res.data.link_token,
            onSuccess: function(public_token) {
              fetch('/link/exchange', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ public_token: public_token })
              })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(res) {
                  if (!res.ok) {
                    alert('Failed to save account: ' + (res.data.error || 'unknown error'));
                    btn.disabled = false;
                    return;
                  }
                  window.location.reload();
                });
            },
            onExit: function() { btn.disabled = false; }
          });
          handler.open();
        })
        .catch(function(e) {
          alert('Error: ' + e.message);
          btn.disabled = false;
        });
    });
  })();
</script>
</body>
</html>
